name: PR Validation

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: Descriptive PR title
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title (conventional commits)
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            refactor
            docs
            test
            ci
            perf
            build
            style
            revert
          requireScope: false
          subjectPattern: ^.{1,}$
          subjectPatternError: |
            The PR title subject must not be empty — describe what the change does.

  pr-description:
    name: PR has a description
    runs-on: ubuntu-latest
    steps:
      - name: Require a non-empty PR description
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          trimmed="$(printf '%s' "$BODY" | tr -d '[:space:]')"
          if [ "${#trimmed}" -lt 10 ]; then
            echo "::error::Pull request description is empty or too short — add a meaningful summary of the change (what & why)."
            exit 1
          fi
          echo "PR description present (${#trimmed} non-space chars)."

  commit-history:
    name: Conventional commit history
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6
